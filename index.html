<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>大鱼吃小鱼 · 深海狂欢</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top-left">
        <div class="hud-score-row">
          <span class="label">得分</span>
          <span id="hud-score">0</span>
        </div>
        <div class="hud-combo-row">
          <span id="hud-combo" class="hud-combo"></span>
          <div class="hud-combo-bar"><div id="hud-combo-fill"></div></div>
        </div>
        <div id="hud-powers"></div>
      </div>

      <div class="hud-top-center">
        <div class="hud-level">
          <span id="hud-level-name">小鱼苗</span>
          <div class="hud-level-bar"><div id="hud-level-fill"></div></div>
        </div>
        <div id="hud-frenzy" class="hud-frenzy hidden">🔥 狂热时刻 · 双倍分数 🔥</div>
        <div id="hud-warning" class="hud-warning hidden"></div>
      </div>

      <div class="hud-top-right">
        <div id="hud-lives" class="hud-lives">❤️❤️❤️</div>
        <div class="hud-dash">
          <span class="label">冲刺</span>
          <div class="hud-dash-bar"><div id="hud-dash-fill" class="hud-dash-fill"></div></div>
        </div>
        <div class="hud-hint">M 静音</div>
      </div>

      <div id="hud-toast" class="hud-toast hidden"></div>
    </div>

    <!-- 开始界面 -->
    <div id="screen-start" class="screen">
      <div class="panel">
        <div class="title-fish">🐟🐠🐡</div>
        <h1>大鱼吃小鱼</h1>
        <p class="subtitle">从一条小鱼苗，长成传说中的海洋之王</p>
        <ul class="rules">
          <li><b>移动鼠标</b>：小鱼跟着游 ・ <b>按住左键/Shift</b>：加速</li>
          <li><b>空格 / 右键</b>：瞬间冲刺扑向猎物（有冷却）</li>
          <li>吃比你小的鱼成长进化，躲开红色标记的大家伙</li>
          <li>连续吞食触发 <b>🔥 狂热连击</b>，分数成长翻倍</li>
          <li>留意 <b>⭐无敌</b> <b>🧲磁铁</b> <b>⚡狂暴</b> 三种神奇泡泡</li>
          <li>小心水母和河豚，还有传闻中的<b>巨齿鲨</b>……</li>
        </ul>
        <button id="btn-start">🌊 潜入大海</button>
      </div>
    </div>

    <!-- 失败界面 -->
    <div id="screen-gameover" class="screen hidden">
      <div class="panel">
        <div class="title-fish">💀</div>
        <h1>葬身鱼腹</h1>
        <p id="gameover-detail" class="subtitle">得分 0</p>
        <button id="btn-restart">🔄 再来一次</button>
      </div>
    </div>

    <!-- 胜利界面 -->
    <div id="screen-win" class="screen hidden">
      <div class="panel">
        <div class="title-fish">👑</div>
        <h1>海洋之王！</h1>
        <p id="win-detail" class="subtitle">得分 0</p>
        <p class="subtitle">整片海域已匍匐在你的鱼鳍之下</p>
        <div class="btn-row">
          <button id="btn-continue">🌊 继续畅游</button>
          <button id="btn-win-restart" class="btn-ghost">🔄 重新开始</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
